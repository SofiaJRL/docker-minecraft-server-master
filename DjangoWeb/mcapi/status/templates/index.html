<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">My Bootstrap Page</a>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        Welcome
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Hello, world!</h5>
                        <p class="card-text" id="api-message">This is a basic Bootstrap example page.</p>
                        <a href="#" class="btn btn-primary" id="api-btn">Get API Text</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('api-btn').addEventListener('click', function(e) {
        e.preventDefault();
        fetch('http://localhost:1000/http://localhost:7000/v1/worlds')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('api-message').textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('api-message').textContent = 'Error fetching data.';
            });
        });
                
    </script>
</body>
</html>
