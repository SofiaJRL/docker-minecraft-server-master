services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      VERSION: "1.21.1"
      TYPE: "YOUER"
      FORGE_VERSION: "60.0.15"

    ports:
      - "25565:25565"
    volumes:
      - minecraftdata:/data
      - ./Minecraft/plugins:/data/plugins
      - ./Minecraft/mods:/mods
      
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  minecraftdata: {}