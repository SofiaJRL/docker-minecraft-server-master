services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      VERSION: "1.21.1"
      TYPE: "YOUER"
      FORGE_VERSION: "60.0.15"

    ports:
      - "25565:25565" # MINECRAFT SERVER
      - "7000:7000" # API REST
    volumes:
      - minecraftdata:/data
      - ./Minecraft/plugins:/data/plugins
      - ./Minecraft/mods:/mods
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - minecraft

  corsProxy:
    image: nginx:1.29.1
    ports:
      - "80:8080"
    volumes:
      - ./DjangoWeb/nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mc
      - frontend
    networks:
      - minecraft
  frontend:
    build: ./DjangoWeb/mcapi
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=mcapi.settings
    networks:
      - minecraft
    


volumes:
  minecraftdata: {}

networks:
  minecraft: